<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Sign in to your Imam Trading Company account."
    />
    <title>Sign in | Imam Trading Company</title>
    <link rel="icon" type="image/png" href="imam-trading-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="login.css?v=15" />
  </head>
  <body>
    <main class="login-layout">
      <a class="brand" href="index.html" aria-label="Imam Trading Company home">
        <img src="imam-trading-logo.png" alt="Imam Trading Company" />
        <span>IMAM TRADING<br /><b>COMPANY</b></span>
      </a>

      <section class="login-card" aria-labelledby="login-title">
        <div class="card-heading">
          <p>WELCOME BACK</p>
          <h1 id="login-title">Sign in to your account</h1>
          <span
            >Sign in with the email and password you used to create your
            account.</span
          >
        </div>
        <form id="login-form" method="post">
          <label for="email">Email address</label>
          <input
            id="email"
            name="email"
            type="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
          />

          <label for="password">Password</label>
          <div class="password-field">
            <input
              id="password"
              name="password"
              type="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            />
            <button
              class="password-toggle"
              type="button"
              aria-label="Show password"
              aria-controls="password"
              aria-pressed="false"
            >
              <svg
                data-eye-show
                viewBox="0 0 24 24"
                aria-hidden="true"
                focusable="false"
              >
                <path
                  d="M2.25 12s3.5-6 9.75-6 9.75 6 9.75 6-3.5 6-9.75 6-9.75-6-9.75-6Z"
                />
                <circle cx="12" cy="12" r="3" />
              </svg>
              <svg
                data-eye-hide
                viewBox="0 0 24 24"
                aria-hidden="true"
                focusable="false"
                hidden
              >
                <path
                  d="M3 3l18 18M10.6 6.2A10.7 10.7 0 0 1 12 6c6.25 0 9.75 6 9.75 6a17 17 0 0 1-3.2 3.8M6.2 6.2C3.7 7.8 2.25 12 2.25 12s3.5 6 9.75 6c1.4 0 2.63-.3 3.7-.78"
                />
                <path d="M9.88 9.88a3 3 0 0 0 4.24 4.24" />
              </svg>
            </button>
          </div>

          <div class="form-options">
            <label class="remember"
              ><input type="checkbox" name="remember" />
              <span>Remember me</span></label
            >
            <a href="#" id="forgot-password">Forgot password?</a>
          </div>

          <button class="submit-button" type="submit">
            Sign in <span>→</span>
          </button>
          <p
            class="form-message"
            id="form-message"
            role="status"
            aria-live="polite"
          ></p>
        </form>

        <p class="signup">
          New to ITC? <a href="signin.html">Request account information</a>
        </p>
      </section>

      <p class="security-note">
        <span>▣</span> Your account access is protected
      </p>
      <a class="back-home" href="index.html">← Back to Imam Trading Company</a>
    </main>
    <script type="module" src="login.js?v=15"></script>
  </body>
</html>
